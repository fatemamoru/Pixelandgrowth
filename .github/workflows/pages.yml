name: Deploy site to GitHub Pages

# Publishes the static site in pixel-growth-website/ to GitHub Pages.
# The site has no build step, so we simply upload that subfolder as the artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the website subfolder is published, not the repo root.
          path: pixel-growth-website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
