<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SEO metadata matches PAGE_METADATA.services in js/seo.js (single source of truth). -->
    <title>Services | Pixel &amp; Growth Digital Solutions</title>
    <meta
      name="description"
      content="Explore Pixel & Growth services for small businesses: website design, digital marketing, social media management, SEO, and practical technology solutions."
    />

    <!-- Shared styling: tokens first (brand palette/fonts), then base, then components. -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="services">
    <!--
      Shared navigation landmark. components.js fills this on load.
      The <noscript> list (from NOSCRIPT_FALLBACK) keeps navigation working
      when JavaScript is disabled or fails to load (Req 12.5).
    -->
    <header data-component="site-nav">
      <noscript>
        <ul class="noscript-nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </noscript>
    </header>

    <main class="page page--services">
      <!-- Exactly ONE <h1> on the page (Req 10.3). -->
      <section class="services-intro">
        <h1 class="page-title">Our Services</h1>
        <p class="page-lead">
          Pixel &amp; Growth helps small businesses build, connect, and grow
          online. Explore what each service includes and find the one that fits
          your goals.
        </p>
      </section>

      <!--
        Container for the five reusable Service cards. services-page.js renders
        SERVICES into this element via renderServiceCard. If one or more entries
        fail to render, the loaded cards are kept and a visible "one or more
        services are unavailable" notice is appended, retaining layout (Req 5.5).
      -->
      <section class="services-section" aria-labelledby="services-heading">
        <h2 id="services-heading" class="section-title">What we offer</h2>
        <div id="services-list" class="services-list" data-component="services-list">
          <!-- Service cards injected by js/services-page.js -->
        </div>
      </section>

      <!-- Call-to-action linking to the Contact Page (Req 5.4). -->
      <section class="services-cta" aria-labelledby="services-cta-heading">
        <h2 id="services-cta-heading" class="section-title">
          Ready to get started?
        </h2>
        <p class="services-cta__text">
          Tell us about your project and the service you are most interested in.
        </p>
        <a class="btn btn-cta" href="contact.html">Get in touch</a>
      </section>
    </main>

    <!--
      Shared footer landmark. components.js fills this on load; the <noscript>
      list keeps footer navigation available without JavaScript (Req 12.5).
    -->
    <footer data-component="site-footer">
      <noscript>
        <ul class="noscript-nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </noscript>
    </footer>

    <!-- Deferred ES modules: shared components and the page-specific renderer. -->
    <script type="module" src="js/components.js"></script>
    <script type="module" src="js/services-page.js"></script>
  </body>
</html>
